# .github/workflows/deploy.yml
name: Deploy Flipbook to GitHub Pages

on:
  push:
    branches: ['main'] # o 'master' a seconda del nome del tuo branch predefinito

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installazione dipendenze
        run: npm ci

      - name: Build del progetto
        run: npm run build

      - name: Configurazione Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact di build
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4